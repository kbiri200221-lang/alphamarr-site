<style>
:root{--navy:#0b1a2b;--blue:#1f6fb2;--sky:#4fb3e8;--bg:#f4f7fa;--card:#fff;--line:#d9e1e8;--muted:#5a6b7d;--ok:#16a765;--warn:#d98e04;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy);font-size:15px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none}header .brand{font-weight:bold;font-size:18px}header .brand span{color:var(--sky)}
header nav{display:flex;gap:12px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}header nav a{opacity:.85}header nav a:hover{opacity:1}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
label{display:block;font-weight:bold;font-size:13px;margin:10px 0 4px}label small{font-weight:normal;color:var(--muted)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
textarea{min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row{grid-template-columns:1fr}}
button,.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 16px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none}
button.sec{background:#e8eef4;color:var(--navy)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.small{padding:5px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:wait}
.muted{color:var(--muted);font-size:13px}.err{color:var(--bad);font-weight:bold}.okmsg{color:var(--ok);font-weight:bold}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:bold;background:#e8eef4}
.b-en_attente{background:#fff3d6;color:#8a5a00}.b-valide,.b-approuve{background:#dcf5e7;color:#0d6b3e}.b-rejete,.b-refuse,.b-suspendu{background:#fbe0dc;color:#8e2418}.b-retire{background:#eee;color:#555}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:start;vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase}
.cal input{padding:6px}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{width:120px;height:120px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.ph{position:relative}.ph .d{position:absolute;inset-inline-start:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.prod img{width:100%;height:190px;object-fit:cover;border-radius:7px}.wm{position:relative}.wm:after{content:"alphamarr";position:absolute;inset-inline-end:8px;bottom:8px;background:rgba(255,255,255,.9);color:var(--navy);font-weight:bold;font-size:12px;padding:2px 8px;border-radius:10px}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:12px}.check input{width:auto;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:#e8eef4;color:var(--navy)}.tabs button.on{background:var(--navy);color:#fff}
.hide{display:none}
.langs{display:inline-flex;gap:4px}.langs .lg{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:3px 9px;font-size:12px;border-radius:12px}.langs .lg.on{background:#fff;color:var(--navy)}
[dir=rtl] body{font-family:Tahoma,Arial,sans-serif}
</style>

let LANG=(()=>{let l=null;try{l=new URLSearchParams(location.search).get('lang')||localStorage.getItem('am_lang')}catch(e){}return I[l]?l:(I[(navigator.language||'').slice(0,2)]?(navigator.language||'').slice(0,2):'fr')})();
const t=(k,v)=>{let s=(I[LANG]&&I[LANG][k])||I.fr[k]||k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
const LOC={fr:'fr-FR',en:'en-GB',ar:'ar-MA'};
function setLang(l){LANG=I[l]?l:'fr';try{localStorage.setItem('am_lang',LANG)}catch(e){}document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';document.title=t('become')+' – AlphaMarr Market';route();}

const badge=s=>`<span class="badge b-${s}">${t('st_'+s)}</span>`;

const fmtD=d=>d?new Date(d).toLocaleDateString(LOC[LANG]||'fr-FR'):'—';
const num=n=>Number(n).toLocaleString(LOC[LANG]||'fr-FR');
const daysOld=d=>(Date.now()-new Date(d).getTime())/864e5;
let S={user:null,admin:false,f:null};

async function signedUrl(bucket,path){if(!path)return null;const {data}=await sb.storage.from(bucket).createSignedUrl(path,3600);return data?.signedUrl}
async function upload(bucket,file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});
  if(error)throw error;return path;
}
function nav(){
  let h=`<a href="#catalogue">${t('catalogue')}</a>`;
  if(!S.user)h+=`<a href="#connexion">${t('login')}</a><a class="btn" href="#inscription">${t('become')}</a>`;
  else{ if(S.admin)h+=`<a href="#admin">${t('admin')}</a>`; else h+=`<a href="#espace">${t('myspace')}</a>`; h+=`<a href="#" id="logout">${t('logout')}</a>`;}
  h+=`<span class="langs">${['fr','en','ar'].map(l=>`<button type="button" class="lg ${l===LANG?'on':''}" data-lg="${l}">${{fr:'FR',en:'EN',ar:'ع'}[l]}</button>`).join('')}</span>`;
  $('#nav').innerHTML=h; const lo=$('#logout'); if(lo)lo.onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.hash='#catalogue';};

async function loadSession(){
  const {data:{session}}=await sb.auth.getSession(); S.user=session?.user||null; S.admin=false; S.f=null;
  if(S.user){ const {data:a}=await sb.rpc('is_admin'); S.admin=!!a;

async function route(){

async function vCatalogue(){
  const {data,error}=await sb.rpc('catalogue'); if(error)throw error;
  let h=`<h1>${t('cat_title')}</h1><p class="muted">${t('cat_intro')} <a href="mailto:contact@alphamarr.com">contact@alphamarr.com</a></p>`;
  if(!data.length){h+=`<div class="card">${t('cat_empty')}</div>`;$('#app').innerHTML=h;return;}
  h+=`<div class="grid">`;
  for(const p of data){
    const img=p.photos[0]?await signedUrl('photos-produits',p.photos[0]):null;
    const cal=p.calibres.map(c=>`${esc(c.calibre)} (${c.nb_cartons} ${t('cartons')})`).join(', ');
    const price=p.prix_public?`${num(p.prix_public)} ${p.devise}/${t('u_'+p.unite_prix)}`:t('on_request');
    h+=`<div class="card prod">${img?`<div class="wm"><img src="${img}" alt=""></div>`:''}
      <h2 style="margin-top:10px">${esc(p.espece)}</h2>
      <div class="muted">${CAT(p.categorie)} ${p.forme?'· '+esc(p.forme):''} · ${t('produced')} ${fmtD(p.date_production)}</div>
      <p><b>${t('sizes')} :</b> ${cal||'—'}<br><b>${t('price')} :</b> ${price}${p.conditions_publiques?`<br><b>${t('terms')} :</b> ${esc(p.conditions_publiques)}`:''}</p>
      <a class="btn" href="mailto:contact@alphamarr.com?subject=${encodeURIComponent(t('req')+' : '+p.espece+' ('+p.id.slice(0,8)+')')}">${t('ask_offer')}</a></div>`;
  }
  $('#app').innerHTML=h+`</div>`;
}

function calRow(){return `<tr><td><input name="cal" required placeholder="${t('ph_size')}"></td><td><input name="nb" type="number" min="1" required></td><td><input name="brut" type="number" step="0.01" min="0.01" required></td><td><input name="net" type="number" step="0.01" min="0.01" required></td><td><button type="button" class="small sec" onclick="this.closest('tr').remove();tot()">✕</button></td></tr>`}
function tot(){let c=0,n=0;document.querySelectorAll('#cals tbody tr').forEach(r=>{const nb=+r.querySelector('[name=nb]').value||0,net=+r.querySelector('[name=net]').value||0;c+=nb;n+=nb*net;});
  const el=$('#tot');if(el)el.textContent=`${t('total')} : ${c} ${t('cartons_l')} · ${(n/1000).toLocaleString(LOC[LANG]||'fr-FR',{maximumFractionDigits:3})} ${t('tonnes_net')}`;}
async function vNouveau(){

  <form id="f">

   <div class="row"><div><label>${t('f_sci')}</label><input name="nom_scientifique" placeholder="Octopus vulgaris" dir="ltr"></div>

   <div><label>${t('f_store')}</label><input name="lieu_stockage" placeholder="${t('ph_store')}"></div></div>
   <h3>${t('sizes_req')} *</h3>
   <table id="cals" class="cal"><thead><tr><th>${t('th_size')}</th><th>${t('th_ctn')}</th><th>${t('th_gross')}</th><th>${t('th_net')}</th><th></th></tr></thead><tbody>${calRow()}</tbody></table>
   <p><button type="button" class="small sec" id="addcal">${t('add_size')}</button> <span class="muted" id="tot"></span></p>
   <div class="row"><div><label>${t('f_price')} *</label><input name="prix" type="number" step="0.01" min="0" required></div>
   <div class="row"><div><label>${t('f_cur')}</label><select name="devise"><option>USD</option><option>EUR</option></select></div><div><label>${t('f_per')}</label><select name="unite"><option value="tonne">${t('u_tonne')}</option><option value="kg">${t('u_kg')}</option></select></div></div></div>

   <div id="anaBox" class="hide"><label>${t('f_analysis')} * <small>${t('f_analysis_hint')}</small></label><input type="file" name="analyse" accept="application/pdf,image/*"></div>
   <label>${t('f_notes')}</label><textarea name="remarques"></textarea>
   <p><button id="submitBtn">${t('send_review')}</button></p><p id="m"></p></form></div>`;
  const fm=$('#f');
  $('#addcal').onclick=()=>{$('#cals tbody').insertAdjacentHTML('beforeend',calRow());};
  $('#cals').addEventListener('input',tot);
  fm.categorie.onchange=()=>{const need=['farine','huile'].includes(fm.categorie.value);$('#anaBox').classList.toggle('hide',!need);fm.analyse.required=need;};
  let exif={};
  fm.photos.onchange=async()=>{exif={};const out=[];for(const f of fm.photos.files){let d=null;try{const x=await exifr.parse(f,['DateTimeOriginal','CreateDate']);d=x?.DateTimeOriginal||x?.CreateDate||null;}catch(_){}
      exif[f.name]=d; if(d&&daysOld(d)>3)out.push(`<span class="err">⚠ ${esc(f.name)} : ${t('photo_old',{d:fmtD(d)})}</span>`);}

        analyse_path:ana,remarques:fm.remarques.value.trim()||null}).select('id').single();
      if(error)throw error;
      const {error:e2}=await sb.from('produit_calibres').insert(cals.map(c=>({...c,produit_id:p.id})));if(e2)throw e2;
      for(const f of files){if(f.size>10485760)throw new Error(`${f.name} : ${t('e_10mb')}`);const path=await upload('photos-produits',f);
        const {error:e3}=await sb.from('produit_photos').insert({produit_id:p.id,path,prise_le:exif[f.name]?new Date(exif[f.name]).toISOString():null});if(e3)throw e3;}
      alert(t('np_ok'));location.hash='#espace';
    }catch(err){$('#m').innerHTML=`<span class="err">${esc(err.message)}</span>`;btn.disabled=false;}};
}

  let h=`<h1>${t('ad_title')}</h1><div class="tabs"><button data-t="produits" class="${ATAB==='produits'?'on':''}">${t('ad_pending')}</button><button data-t="fournisseurs" class="${ATAB==='fournisseurs'?'on':''}">${t('ad_sup')}</button><button data-t="tous" class="${ATAB==='tous'?'on':''}">${t('ad_all')}</button></div><div id="adm">${t('loading')}</div>`;
  $('#app').innerHTML=h; document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ATAB=b.dataset.t;vAdmin();});
  if(ATAB==='fournisseurs')return admFournisseurs(); return admProduits(ATAB==='produits');
}
async function admFournisseurs(){
  const {data}=await sb.from('fournisseurs').select('*').order('created_at',{ascending:false});
  let h='';
  for(const f of data){const idu=await signedUrl('pieces-identite',f.piece_identite_path);
    h+=`<div class="card"><h2>${esc(f.societe)} ${badge(f.statut)}</h2>
    <table><tr><th>${t('a_resp')}</th><td>${esc(f.nom_complet)}</td><th>NIF</th><td>${esc(f.nif||'—')}</td></tr>
    <tr><th>${t('a_tel')}</th><td><span dir="ltr">${esc(f.telephone)}</span> ${f.telephone_verifie?'✅ '+t('a_verified'):`<span class="muted">${t('a_tocall')}</span>`}</td><th>${t('email')}</th><td>${esc(f.email)}</td></tr>
    <tr><th>${t('f_agr')}</th><td>${esc(f.agrement_usine)}</td><th>${t('a_id')}</th><td>${idu?`<a href="${idu}" target="_blank">${t('open')}</a>`:'—'}</td></tr>
    <tr><th>${t('a_cgu')}</th><td>${fmtD(f.cgu_acceptees_le)} (v${esc(f.cgu_version)})</td><th>${t('a_since')}</th><td>${fmtD(f.created_at)}</td></tr></table>
    ${f.motif?`<p class="muted">${t('a_reason')} : ${esc(f.motif)}</p>`:''}
    <p><label style="display:inline"><input type="checkbox" style="width:auto" data-tel="${f.id}" ${f.telephone_verifie?'checked':''}> ${t('a_telchk')}</label></p>
    <p><button class="ok small" data-fv="${f.id}">${t('validate')}</button> <button class="bad small" data-fr="${f.id}">${t('refuse')}</button> <button class="sec small" data-fs="${f.id}">${t('suspend')}</button></p></div>`;}
  $('#adm').innerHTML=h||`<div class="card">${t('ad_nosup')}</div>`;
  const upd=async(id,v)=>{const {error}=await sb.from('fournisseurs').update(v).eq('id',id);if(error)alert(error.message);admFournisseurs();};
  document.querySelectorAll('[data-tel]').forEach(c=>c.onchange=()=>upd(c.dataset.tel,{telephone_verifie:c.checked}));
  document.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>upd(b.dataset.fv,{statut:'valide',motif:null}));
  document.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{const m=prompt(t('p_reason_ref'));if(m!==null)upd(b.dataset.fr,{statut:'rejete',motif:m});});
  document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{const m=prompt(t('p_reason_susp'));if(m!==null)upd(b.dataset.fs,{statut:'suspendu',motif:m});});
}
async function admProduits(pendingOnly){
  let q=sb.from('produits').select('*,fournisseurs(societe,telephone),produit_calibres(*),produit_photos(*)').order('created_at',{ascending:false});
  if(pendingOnly)q=q.eq('statut','en_attente');
  const {data,error}=await q; if(error)throw error;
  let h='';
  for(const p of data){
    let ph='';for(const x of p.produit_photos){const u=await signedUrl('photos-produits',x.path);const old=x.prise_le&&(new Date(p.created_at)-new Date(x.prise_le))/864e5>3;
      ph+=`<a class="ph" href="${u}" target="_blank"><img src="${u}"><span class="d" style="${old?'background:#c0392b':''}">${x.prise_le?t('taken')+' '+fmtD(x.prise_le):t('unknown_date')}</span></a>`;}
    const ana=await signedUrl('analyses',p.analyse_path);
    const cals=p.produit_calibres.map(c=>`<tr><td>${esc(c.calibre)}</td><td>${c.nb_cartons}</td><td>${c.poids_brut_kg}</td><td>${c.poids_net_kg}</td><td>${(c.nb_cartons*c.poids_net_kg/1000).toFixed(3)} t</td></tr>`).join('');
    h+=`<div class="card"><h2>${esc(p.espece)} ${badge(p.statut)}</h2>
    <div class="muted">${esc(p.fournisseurs?.societe)} (<span dir="ltr">${esc(p.fournisseurs?.telephone)}</span>) · ${CAT(p.categorie)} ${p.forme?'· '+esc(p.forme):''} · ${t('th_prod')} ${fmtD(p.date_production)} · ${t('deposited')} ${fmtD(p.created_at)} ${p.lieu_stockage?'· '+esc(p.lieu_stockage):''}</div>
    <table style="margin-top:8px"><tr><th>${t('th_size')}</th><th>${t('th_cartons')}</th><th>${t('th_gross_s')}</th><th>${t('th_net_s')}</th><th>${t('th_tot')}</th></tr>${cals}</table>
    <p><b>${t('sup_price')} :</b> ${p.prix_fournisseur} ${p.devise}/${t('u_'+p.unite_prix)} ${ana?` · <a href="${ana}" target="_blank">${t('analysis')}</a>`:''}</p>
    ${p.remarques?`<p class="muted">${t('notes')} : ${esc(p.remarques)}</p>`:''}
    <div class="photos">${ph}</div>
    <div class="row" style="margin-top:10px"><div><label>${t('pub_price')} (${p.devise}/${t('u_'+p.unite_prix)}) <small>${t('margin_incl')}</small></label><input id="pp-${p.id}" type="number" step="0.01" value="${p.prix_public??''}"></div>
    <div><label>${t('pub_terms')}</label><input id="cp-${p.id}" value="${esc(p.conditions_publiques||t('def_terms'))}"></div></div>
    <p><button class="ok small" data-pa="${p.id}">${t('approve')}</button> <button class="bad small" data-pr="${p.id}">${t('refuse')}</button> ${p.statut==='approuve'?`<button class="sec small" data-px="${p.id}">${t('withdraw')}</button>`:''}</p></div>`;
  }
  $('#adm').innerHTML=h||`<div class="card">${t('ad_noprod')}</div>`;
  const upd=async(id,v)=>{const {error}=await sb.from('produits').update(v).eq('id',id);if(error)alert(error.message);vAdmin();};
  document.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{const id=b.dataset.pa,pp=$('#pp-'+id).value;
    upd(id,{statut:'approuve',motif:null,prix_public:pp===''?null:+pp,conditions_publiques:$('#cp-'+id).value.trim()||null});});
  document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const m=prompt(t('p_reason_vis'));if(m!==null)upd(b.dataset.pr,{statut:'refuse',motif:m});});
  document.querySelectorAll('[data-px]').forEach(b=>b.onclick=()=>upd(b.dataset.px,{statut:'retire'}));
}
route();
</script>
</body>
</html>
