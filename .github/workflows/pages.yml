name: Build section pages
on:
  push:
    paths: ["index.html", "build_pages.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build_pages.py
      - name: Commit pages
        run: |
          git config user.name "alphamarr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add about.html stock.html news.html contact.html
          git diff --cached --quiet || (git commit -m "Rebuild section pages" && git push)
